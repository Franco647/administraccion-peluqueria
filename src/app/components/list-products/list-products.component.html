<div class="container">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <h4 class="margin">Listado de Clientes</h4>
        <button type="button" class="btn btn-dark" [routerLink]="['/add']" routerLinkActive="add" >AGREGAR</button>
    </div>

    <table class="table table-hover">
        <thead> 
          <tr>
            <th scope="col">Nombre y Apellido:</th>
            <th scope="col">Fecha:</th>
            <th scope="col">Importe:</th>
            <th scope="col">Trabajo Realizado:</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of listProducts" class="table-dark p">
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
            <td>{{ item.price }}</td>
            <td>{{ item.date }}</td>
            <td>
                <button type="button" class="btn btn-light" routerLink="/edit/{{ item.id }}">Editar</button>
                <button type="button" class="btn btn-danger ms-2">Borrar</button>
            </td>
          </tr>
        </tbody>
      </table>
</div>
