<!-- <app-progress-bar *ngIf="loading"></app-progress-bar> -->
<div *ngIf="!loading" class="row mt-5">
    <div class="col-lg-4 offset-lg-4">
        <div class="card text-white bg-dark mb-3" style="max-width: 25rem;">
            <div class="card-header text-center">{{ operacion }} un Cliente</div>
            <div class="card-body">
                <form [formGroup]="form" (ngSubmit)="addProduct()">
                    <input 
                        formControlName="name" 
                        type="text" 
                        class="form-control" 
                        placeholder="Ingrese nombre"
                    >
                    <span *ngIf="form.get('name')?.hasError('required') && form.get('name')?.touched" class="text-danger">
                        El campo nombre es <strong>requerido</strong>
                    </span>
                    <input 
                        formControlName="description" 
                        type="text"
                        class="form-control mt-2" 
                        placeholder="Ingrese descripcion"
                    >
                    <span *ngIf="form.get('description')?.hasError('required') && form.get('description')?.touched" class="text-danger">
                        El campo descripcion es <strong>requerido</strong>
                    </span>
                    <input 
                        formControlName="price"  
                        type="number" 
                        class="form-control mt-2" 
                        placeholder="Ingrese precio"
                    >
                    <span *ngIf="form.get('price')?.hasError('required') && form.get('price')?.touched" class="text-danger">
                        El campo price es <strong>requerido</strong>
                    </span>
                    <input 
                        formControlName="date" 
                        max="9999-12-31" 
                        type="date" 
                        class="form-control mt-2"
                    >
                    <span *ngIf="form.get('date')?.hasError('required') && form.get('date')?.touched" class="text-danger">
                        El campo fecha es <strong>requerido</strong>
                    </span>
                    <div class="d-flex justify-content-between mt-4">
                            <button routerLink="/" type="button" class="btn-secondary-its col-md-5">Volver</button>
                            <button [disabled]="form.invalid" type="submit" class="btn-primary-its col-md-5">Aceptar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
