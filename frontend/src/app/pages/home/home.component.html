
<div class="card-header text-center">Inciar sesión</div>
<div class="card-body d-flex justify-content-center">
    <form [formGroup]="form" (ngSubmit)="login()">
        <div class="col-md-12">
            <label>Email:</label>
            <input 
                formControlName="email" 
                type="text"
                class="form-control" 
            >
        </div>

        <div class="col-md-12 mt-1">
            <label>Contraseña:</label>
            <input 
                formControlName="password"  
                type="password" 
                class="form-control" 
            >
        </div>

        <div *ngIf="errorMsg" class="mt-4 alert alert-danger">
            {{ errorMsg }}
        </div>

        <div class="mt-4 pl-3 pr-3">
            <button type="submit" class="btn-primary-its col-md-12">Ingresar</button>
        </div>
    </form>
</div>
