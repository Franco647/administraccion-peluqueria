
<div class="card-header text-center">Agregar un Trabajo</div>
<div class="card-body">
    <form [formGroup]="form" (ngSubmit)="login()">
        <div class="col-md-12">
            <label>Usuario:</label>
            <input 
                formControlName="user" 
                type="text"
                class="form-control" 
            >
        </div>

        <div class="col-md-12 mt-1">
            <label>Contraseña:</label>
            <input 
                formControlName="password"  
                type="password" 
                class="form-control" 
            >
        </div>

        <div class="d-flex justify-content-between mt-4 pl-3 pr-3">
            <button [disabled]="form.invalid" type="submit" class="btn-primary-its col-md-5">Ingresar</button>
        </div>
    </form>
</div>
