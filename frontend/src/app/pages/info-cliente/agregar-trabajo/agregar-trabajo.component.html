
<div class="card-header text-center">Agregar un Trabajo</div>
<div class="card-body">
    <form [formGroup]="form" (ngSubmit)="addProduct()">
        <div class="col-md-12">
            <label>Trabajo:</label>
            <input 
                formControlName="description" 
                type="text"
                class="form-control" 
            >
        </div>

        <div class="col-md-12 mt-1">
            <label>Importe:</label>
            <input 
                formControlName="price"  
                type="number" 
                class="form-control" 
            >
        </div>

        <div class="col-md-12 mt-1">
            <label>Metado de pago:</label>
            <select 
                formControlName="metodo"
                class="form-select form-control"
            >
                <option *ngFor="let metodo of metodos" [value]="metodo.id"> {{ metodo.descripcion }} </option>
            </select>
        </div>

        <div class="col-md-12 mt-1">
            <label>Fecha:</label>
            <input 
                formControlName="date" 
                max="9999-12-31" 
                type="date" 
                class="form-control"
            >
        </div>

        <div class="d-flex justify-content-between mt-4 pl-3 pr-3">
            <button routerLink="/" type="button" class="btn-secondary-its col-md-5" (click)="cerrar()">Volver</button>
            <button [disabled]="form.invalid" type="submit" class="btn-primary-its col-md-5">Aceptar</button>
        </div>
    </form>
</div>
