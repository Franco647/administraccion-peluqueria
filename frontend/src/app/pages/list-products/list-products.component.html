<div class="page-container">

  <div class="d-flex align-items-center mb-3 w-100">
    <div class="d-flex align-items-center w-50">
      <h2>Gestión de Clientes</h2>
      <button (click)="logOut()" class="btn-secondary-its col-md-2 ml-4 mt-3 mb-3">Salir</button>
    </div>

    <div class="d-flex justify-content-end w-50">
      <button type="button" class="btn-primary-its col-md-6" (click)="agregarCliente()">Agregar Cliente</button>
    </div>
  </div>


  <table class="table table-hover mt-2">
    <thead> 
      <tr>
        <th class="text-center align-middle" scope="col">Nombre y Apellido:</th>
        <th class="text-center align-middle" scope="col">Fecha de nacimiento:</th>
        <th class="text-center align-middle" scope="col">Sexo:</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="listProducts.length == 0">
        <tr >
          <td colspan="5" class="text-center">No hay clientes.</td>
        </tr>
      </ng-container>
      <ng-container *ngFor="let item of listProducts">
        <tr (click)="toggleDetails(item.id)" class="tr-body" [ngClass]="{'head-active': selectedItem === item}">
          <td class="text-center align-middle">{{ item.name }}</td>
          <td class="text-center align-middle">{{ utils.formatDate(item.fecha_nacimiento) }}</td>
          <td class="text-center align-middle">{{ item.sexo }}</td>
          <td>
            <button type="button" class="btn-secondary-its text-center align-middle w-100" (click)="editarCliente(item.id)">Editar Cliente</button>
          </td>
          <!-- <td class="text-center align-middle">
            <button type="button" class="btn-outline-primary-its w-100" routerLink="/edit/{{ item.id }}">Info</button>
          </td> -->
        </tr>
      </ng-container>
    </tbody>
  </table>

</div>
