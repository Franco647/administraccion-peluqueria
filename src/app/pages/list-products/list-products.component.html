<div class="page-container">

  <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h2>Listado de Clientes</h2>
    <button type="button" class="btn-primary-its" [routerLink]="['/add']" routerLinkActive="add">Agregar</button>
  </div>

  <!-- <app-collapse title="Líneas" tipo="secondary"></app-collapse> -->
  <table class="table table-hover mt-2">
    <thead> 
      <tr>
        <th class="text-center align-middle" scope="col">Nombre y Apellido:</th>
        <th class="text-center align-middle" scope="col">Trabajo Realizado:</th>
        <th class="text-center align-middle" scope="col">Importe:</th>
        <th class="text-center align-middle" scope="col">Fecha:</th>
        <th class="text-center align-middle" scope="col"></th>
        <th class="text-center align-middle" scope="col"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="listProducts.length == 0">
        <td colspan="5" class="text-center">No hay clientes.</td>
      </tr>
      <tr *ngFor="let item of listProducts">
        <td class="text-center align-middle">{{ item.name }}</td>
        <td class="text-center align-middle">{{ item.description }}</td>
        <td class="text-center align-middle">{{ item.price | currency }}</td>
        <td class="text-center align-middle">{{ utils.formatDate(item.date) }}</td>
        <td class="text-center align-middle">
            <button type="button" class="btn-secondary-its w-100" routerLink="/edit/{{ item.id }}">Editar</button>
        </td>
        <td text-center align-middle>
          <button type="button" class="btn-danger-its w-100" (click)="deleteCliente(item.id!)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
