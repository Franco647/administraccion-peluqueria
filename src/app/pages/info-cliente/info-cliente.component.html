<div class="page-container">

<table class="table table-hover mt-2">
    <thead> 
      <tr>
        <th class="text-center align-middle" scope="col">Nombre y Apellido:</th>
        <th class="text-center align-middle" scope="col">Trabajo Realizado:</th>
        <th class="text-center align-middle" scope="col">Importe:</th>
        <th class="text-center align-middle" scope="col">Fecha:</th>
        <th class="text-center align-middle" scope="col"></th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="listProducts.length == 0">
        <tr >
          <td colspan="5" class="text-center">No hay datos.</td>
        </tr>
      </ng-container>
      <ng-container *ngFor="let item of listProducts">
        <tr class="tr-body">
          <td class="text-center align-middle">{{ item.name }}</td>
          <td class="text-center align-middle">{{ item.description }}</td>
          <td class="text-center align-middle">{{ item.price | currency }}</td>
          <td class="text-center align-middle">{{ utils.formatDate(item.date) }}</td>
          <td class="text-center align-middle">
            <button type="button" class="btn-secondary-its w-100" routerLink="/">Volver</button>
          </td>

        </tr>
      </ng-container>
    </tbody>
  </table>

</div>
